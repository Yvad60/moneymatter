name: Deploy trace branch to VPS

# Builds the backend/frontend images from this fork's custom trace-app code
# and deploys them to the self-hosted VPS. Separate from upstream's
# image-to-docker-hub.yml / preview-deploy.yml, which target letehaha's own
# infra via different secrets — this workflow is fork-specific.

on:
  push:
    branches: [trace]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/yvad60/budget-tracker-be
  FRONTEND_IMAGE: ghcr.io/yvad60/budget-tracker-fe

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # A newer push cancels any build still running for an older one.
    concurrency:
      group: build-trace-vps
      cancel-in-progress: true
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Decide which images need rebuilding. Manual runs, no earlier successful
      # run, an unreachable commit, or a workflow change rebuild both.
      - name: Detect changed images
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # Diff against the last *successful* run, not the previous push, so
          # changes from runs that were cancelled by a newer push still build.
          BEFORE=$(gh run list --workflow deploy-trace-vps.yml --branch trace --status success \
            --limit 1 --json headSha --jq '.[0].headSha // empty' || true)
          backend=true
          frontend=true
          if [ "${{ github.event_name }}" = "push" ] \
            && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            echo "$changed"
            if ! echo "$changed" | grep -q '^.github/workflows/deploy-trace-vps.yml$'; then
              shared='^(package(-lock)?\.json|post-install\.sh|tsconfig\.json|patches/|packages/shared/)'
              echo "$changed" | grep -qE "$shared|^packages/backend/|^self-hosting/" || backend=false
              echo "$changed" | grep -qE "$shared|^packages/(frontend|landing)/|^self-hosting/frontend/" || frontend=false
            fi
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend
        if: steps.changes.outputs.backend == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./self-hosting/backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          build-args: |
            SENTRY_RELEASE=${{ github.sha }}

      - name: Build and push frontend
        if: steps.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./self-hosting/frontend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          build-args: |
            VITE_SENTRY_RELEASE=${{ github.sha }}
            VITE_APP_COMMIT_HASH=${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Never cancel a deploy mid-flight (half-pulled images on the VPS); a newer
    # run just waits its turn.
    concurrency:
      group: deploy-trace-vps
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/moneymatter
            git fetch origin trace
            git checkout trace
            git reset --hard origin/trace
            cd self-hosting
            docker compose -f docker-compose.yml -f docker-compose.ghcr.yml pull
            docker compose -f docker-compose.yml -f docker-compose.ghcr.yml up -d
            docker image prune -f
